# Local development only. Mirrors Aurora PostgreSQL major version.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: limon_owner
      POSTGRES_PASSWORD: limon_owner
      POSTGRES_DB: limon
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/database/docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
volumes:
  pgdata:
