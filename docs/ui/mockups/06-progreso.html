<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Progreso y metas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3173BD}a:hover{color:#245A96}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:400}}
@keyframes fillbar{from{transform:scaleX(0)}}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#5F6B63;text-decoration:none;min-width:56px;min-height:44px;justify-content:center}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{min-height:32px;padding:0 10px;border:none;border-radius:999px;font-family:Nunito,sans-serif;font-size:12px;font-weight:700}
.tile{background:#FFFFFF;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #FBF8F2; color: #1B1F1C; font-family: Nunito, system-ui, sans-serif;">
<div style="padding: 56px 24px 0; display: flex; flex-direction: column; gap: 12px;">
<h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 30px; animation: rise 500ms ease-out both;">Tu progreso</h1>

<div style="background: #FFFFFF; border-radius: 24px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 24px rgba(27,31,28,.06); animation: rise 500ms ease-out 80ms both;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600;">Meta: 71 kg</span><span style="font-size: 13px; color: #5F6B63;">faltan 2.8 kg</span></div>
<span style="height: 12px; border-radius: 99px; background: {{tint}}; overflow: hidden;"><span style="display: block; width: 60%; height: 100%; border-radius: 99px; background: {{brand}}; transform-origin: left; animation: fillbar 900ms cubic-bezier(.3,.7,.2,1) 300ms both;"></span></span>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #5F6B63;"><span>78.0 kg · 18 ago</span><span>60%</span></div>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; animation: rise 500ms ease-out 160ms both;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<span style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #5F6B63;">Peso</span><span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600;">73.8 kg</span></span>
<div role="group" aria-label="Periodo" style="display: flex; gap: 2px; background: #F3EFE6; border-radius: 999px; padding: 3px;">
<button class="seg" aria-pressed="true" style="background: #FFFFFF; color: #1B1F1C;">8 sem</button>
<button class="seg" aria-pressed="false" style="background: transparent; color: #5F6B63;">3 meses</button>
<button class="seg" aria-pressed="false" style="background: transparent; color: #5F6B63;">Todo</button>
</div>
</div>
<svg viewBox="0 0 310 140" width="100%" height="140">
<path d="M10 130 H300" style="stroke: #ECE7DC; stroke-width: 1;"></path>
<path d="M10 70 H300" style="stroke: #F3EFE6; stroke-width: 1;"></path>
<path d="M10 10 H300" style="stroke: #F3EFE6; stroke-width: 1;"></path>
<path d="M10 10 L50 30 L90 45 L130 60 L170 82 L210 95 L250 107 L290 115" style="fill: none; stroke: {{brand}}; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 400; animation: draw 1100ms ease-out 400ms both;"></path>
<circle cx="290" cy="115" r="6" style="fill: {{brand}}; stroke: #FFFFFF; stroke-width: 3; animation: rise 300ms ease-out 1400ms both;"></circle>
</svg>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #5F6B63;"><span>18 ago</span><span>15 sep</span><span>Hoy</span></div>
</div>

<button style="min-height: 52px; border-radius: 999px; border: none; background: {{brand}}; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; animation: rise 500ms ease-out 240ms both;"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>Registrar peso</button>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; animation: rise 500ms ease-out 320ms both;">
<div class="tile"><span style="font-size: 12px; color: #5F6B63;">Cintura</span><span style="font-family: Fredoka, sans-serif; font-size: 20px; font-weight: 600;">82 cm</span><span style="font-size: 12px; font-weight: 700; color: {{brand}};">−3 cm</span></div>
<div class="tile"><span style="font-size: 12px; color: #5F6B63;">Cadera</span><span style="font-family: Fredoka, sans-serif; font-size: 20px; font-weight: 600;">98 cm</span><span style="font-size: 12px; font-weight: 700; color: {{brand}};">−2 cm</span></div>
<div class="tile"><span style="font-size: 12px; color: #5F6B63;">Grasa</span><span style="font-family: Fredoka, sans-serif; font-size: 20px; font-weight: 600;">29%</span><span style="font-size: 12px; font-weight: 700; color: {{brand}};">−1.5%</span></div>
</div>

<div style="background: #FFFFFF; border-radius: 22px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; animation: rise 500ms ease-out 400ms both;">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{tint}}; color: {{brand}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1;"><span style="font-weight: 700;">Agua</span><span style="font-size: 12px; color: #5F6B63;">1.5 de 2.4 L hoy</span></span>
<button style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: {{tint}}; color: {{brand}}; font-family: Nunito, sans-serif; font-weight: 700; font-size: 14px;">+250 ml</button>
</div>
</div>

<nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #ECE7DC; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box;">

<a class="tab" href="Recetas.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Recetas</a>
<a class="tab" href="#" style="color: {{brand}};"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-8"></path></svg>Progreso</a>
<a class="tab" href="Perfil.dc.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#3173BD","options":["#3173BD","#2E7D32","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const brand = this.props.brand ?? '#3173BD';
return { brand: brand, tint: 'color-mix(in srgb, ' + brand + ' 16%, #FFFFFF)' };
}
}
</script>
</body>
</html>
