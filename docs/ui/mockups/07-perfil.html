<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perfil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3173BD}a:hover{color:#245A96}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#5F6B63;text-decoration:none;min-width:56px;min-height:44px;justify-content:center}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kv{display:flex;justify-content:space-between;align-items:center;min-height:36px;font-size:15px;border-bottom:1px solid #F0EBE1}
.act{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;border:none;background:none;padding:0;font-family:Nunito,sans-serif;font-size:15px;font-weight:700;text-align:left;color:#1B1F1C;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #FBF8F2; color: #1B1F1C; font-family: Nunito, system-ui, sans-serif;">
<div style="padding: 56px 24px 0; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 14px; animation: rise 500ms ease-out both;">
<span style="width: 60px; height: 60px; border-radius: 99px; background: {{tint}}; color: {{brand}}; display: flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-size: 26px; font-weight: 600;">A</span>
<span style="display: flex; flex-direction: column;"><h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 26px;">Ana</h1><span style="font-size: 13px; color: #5F6B63;">ana@correo.com</span></span>
</div>

<div style="background: {{brand}}; color: #FFFFFF; border-radius: 24px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; animation: rise 500ms ease-out 80ms both;">
<span style="font-size: 13px;">Tu meta diaria</span>
<span style="font-family: Fredoka, sans-serif; font-size: 26px; font-weight: 600; line-height: 1;">1,800 kcal</span>
<div style="display: flex; gap: 6px; font-size: 12px; font-weight: 700;">
<span style="background: rgba(255,255,255,.2); border-radius: 99px; padding: 4px 9px;">Proteína 112 g</span>
<span style="background: rgba(255,255,255,.2); border-radius: 99px; padding: 4px 9px;">Carbs 205 g</span>
<span style="background: rgba(255,255,255,.2); border-radius: 99px; padding: 4px 9px;">Grasa 58 g</span>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 10px 18px 8px; display: flex; flex-direction: column; animation: rise 500ms ease-out 160ms both;">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 36px;"><span style="font-family: Fredoka, sans-serif; font-size: 17px; font-weight: 600;">Tus datos</span><a href="#" style="font-weight: 700; font-size: 14px; color: {{brand}}; text-decoration: none; min-height: 44px; display: flex; align-items: center;">Editar</a></div>
<sc-for list="{{facts}}" as="f" hint-placeholder-count="5">
<div class="kv"><span style="color: #5F6B63;">{{f.k}}</span><span style="font-weight: 700;">{{f.v}}</span></div>
</sc-for>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 4px 18px; display: flex; flex-direction: column; animation: rise 500ms ease-out 240ms both;">
<a class="act" href="#"><svg class="ico" viewBox="0 0 24 24" style="color: {{brand}};"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18"></path></svg><span style="flex-grow: 1;">Suscripción</span><span style="font-size: 13px; color: #2E7D32; background: #E3F1E4; border-radius: 99px; padding: 3px 9px;">Activa</span></a>
<button class="act" style="border-top: 1px solid #F0EBE1;"><svg class="ico" viewBox="0 0 24 24" style="color: #5F6B63;"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"></path></svg>Cerrar sesión</button>
<button class="act" style="border-top: 1px solid #F0EBE1; color: #C62828;"><svg class="ico" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"></path></svg>Eliminar cuenta</button>
</div>
</div>

<nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #ECE7DC; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box;">
<a class="tab" href="Main.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Inicio</a>
<a class="tab" href="Comidas.dc.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle></svg>Comidas</a>
<a class="tab" href="Recetas.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Recetas</a>
<a class="tab" href="Progreso.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-8"></path></svg>Progreso</a>
<a class="tab" href="#" style="color: {{brand}};"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#3173BD","options":["#3173BD","#2E7D32","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const brand = this.props.brand ?? '#3173BD';
const facts = [['Estatura', '1.62 m'], ['Peso', '73.8 kg'], ['Actividad', 'Moderada'], ['Comidas al día', '5'], ['Alergias', 'Ninguna']].map((x) => ({ k: x[0], v: x[1] }));
return { brand: brand, tint: 'color-mix(in srgb, ' + brand + ' 16%, #FFFFFF)', facts: facts };
}
}
</script>
</body>
</html>
