<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Comidas: semana</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3173BD}a:hover{color:#245A96}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#5F6B63;text-decoration:none;min-width:56px;min-height:44px;justify-content:center}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.meal{display:flex;align-items:center;gap:12px;background:#FFFFFF;border-radius:20px;padding:10px 12px 10px 14px;text-decoration:none;color:#1B1F1C;min-height:44px}
.heart{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;padding:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #FBF8F2; color: #1B1F1C; font-family: Nunito, system-ui, sans-serif;">
<div style="padding: 56px 24px 0; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 2px; animation: rise 500ms ease-out both;">
<span style="font-size: 14px; color: #5F6B63;">6 al 12 de octubre</span>
<h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 30px;">Tu semana</h1>
</div>

<div style="display: flex; justify-content: space-between; animation: rise 500ms ease-out 80ms both;">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button aria-label="{{d.aria}}" style="width: 44px; height: 60px; border: none; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: Nunito, sans-serif; {{d.style}}"><span style="font-size: 12px; font-weight: 600;">{{d.l}}</span><span style="font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600;">{{d.n}}</span></button>
</sc-for>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 24px rgba(27,31,28,.06); animation: rise 500ms ease-out 160ms both;">
<div style="position: relative; width: 64px; height: 64px; flex-shrink: 0;">
<svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="27" style="fill: none; stroke: {{tint}}; stroke-width: 7;"></circle><circle cx="32" cy="32" r="27" transform="rotate(-90 32 32)" style="fill: none; stroke: {{brand}}; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 170; stroke-dashoffset: 2; --len: 170; animation: draw 900ms cubic-bezier(.2,.8,.2,1) 200ms both;"></circle></svg>
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-size: 15px; font-weight: 600;">99%</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
<span style="font-size: 13px; color: #5F6B63;"><b style="font-family: Fredoka, sans-serif; font-size: 18px; color: #1B1F1C;">1,780</b> de 1,800 kcal</span>
<div style="display: flex; gap: 6px; font-size: 12px; font-weight: 700;">
<span style="background: {{tint}}; border-radius: 99px; padding: 4px 8px;">P 112 g</span>
<span style="background: #FBEFC4; border-radius: 99px; padding: 4px 8px;">C 205 g</span>
<span style="background: #ECE7DC; border-radius: 99px; padding: 4px 8px;">G 58 g</span>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{meals}}" as="m" hint-placeholder-count="5">
<a class="meal" href="ComidaDetalle.dc.html" style="{{m.anim}}">
<span style="width: 44px; height: 44px; border-radius: 14px; background: {{tint}}; color: {{brand}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;"><span style="font-size: 12px; color: #5F6B63;">{{m.when}}</span><span style="font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{m.dish}}</span></span>
<span style="font-size: 13px; color: #5F6B63; white-space: nowrap;">{{m.kcal}}</span>
<span class="heart" aria-label="{{m.favLabel}}" style="color: {{m.favColor}};"><svg class="ico" viewBox="0 0 24 24" style="fill: {{m.favFill}};"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></span>
</a>
</sc-for>
</div>

<button style="min-height: 48px; border-radius: 999px; border: 2px solid {{brand}}; background: transparent; color: {{brand}}; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 700; animation: rise 500ms ease-out 640ms both;">Cambiar el menú de este día</button>
</div>

<nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #ECE7DC; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box;">
<a class="tab" href="Main.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Inicio</a>
<a class="tab" href="#" style="color: {{brand}};"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle></svg>Comidas</a>
<a class="tab" href="Recetas.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Recetas</a>
<a class="tab" href="Progreso.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-8"></path></svg>Progreso</a>
<a class="tab" href="Perfil.dc.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#3173BD","options":["#3173BD","#2E7D32","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const brand = this.props.brand ?? '#3173BD';
const tint = 'color-mix(in srgb, ' + brand + ' 16%, #FFFFFF)';
const names = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const full = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const days = names.map((l, i) => ({
l: l, n: String(6 + i), aria: full[i] + ' ' + (6 + i) + (i === 0 ? ', hoy' : ''),
style: i === 0 ? 'background: ' + brand + '; color: #FFFFFF;' : 'background: #FFFFFF; color: #1B1F1C;',
}));
const list = [
['Desayuno · 8:00', 'Avena con fresas', '380 kcal', true],
['Colación · 11:00', 'Yogur con nuez', '180 kcal', false],
['Comida · 14:00', 'Ensalada de quinoa con pollo', '520 kcal', true],
['Colación · 17:30', 'Jícama con limón', '120 kcal', false],
['Cena · 20:30', 'Tacos de pescado', '580 kcal', false],
];
const meals = list.map((m, i) => ({
when: m[0], dish: m[1], kcal: m[2],
favLabel: m[3] ? 'Quitar de favoritos' : 'Agregar a favoritos',
favColor: m[3] ? '#D9480F' : '#A39B8C', favFill: m[3] ? '#D9480F' : 'none',
anim: 'animation: rise 500ms ease-out ' + (240 + i * 80) + 'ms both;',
}));
return { brand: brand, tint: tint, days: days, meals: meals };
}
}
</script>
</body>
</html>
