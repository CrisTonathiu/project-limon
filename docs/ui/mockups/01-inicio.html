<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio: Anillo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3173BD}a:hover{color:#245A96}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(-4deg)}}
.ring{fill:none;stroke-linecap:round;animation:draw 900ms cubic-bezier(.2,.8,.2,1) both}
.track{fill:none}
.spark{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;--len:600;animation:draw 1100ms ease-out 700ms both}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#5F6B63;text-decoration:none;min-width:56px;min-height:44px;justify-content:center}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #FBF8F2; color: #1B1F1C; font-family: Nunito, system-ui, sans-serif;">
<div style="padding: 56px 24px 0; display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; align-items: center; justify-content: space-between; animation: rise 500ms ease-out both;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 14px; color: #5F6B63;">Lunes 6 de octubre</span>
<h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 30px;">Hola, Ana</h1>
</div>
<button aria-label="Perfil" style="width: 48px; height: 48px; border-radius: 999px; border: none; background: {{tint}}; color: {{brand}}; font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600;">A</button>
</div>

<div style="background: #FFFFFF; border-radius: 28px; padding: 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 6px 24px rgba(27,31,28,.06); animation: rise 500ms ease-out 80ms both;">
<div style="position: relative; width: 180px; height: 180px; flex-shrink: 0;">
<svg viewBox="0 0 220 220" width="180" height="180">
<circle class="track" cx="110" cy="110" r="96" style="stroke: {{tint}}; stroke-width: 16;"></circle>
<circle class="ring" cx="110" cy="110" r="96" transform="rotate(-90 110 110)" style="stroke: {{brand}}; stroke-width: 16; stroke-dasharray: 603; stroke-dashoffset: 241; --len: 603;"></circle>
<circle class="track" cx="110" cy="110" r="72" style="stroke: #FBEFC4; stroke-width: 12;"></circle>
<circle class="ring" cx="110" cy="110" r="72" transform="rotate(-90 110 110)" style="stroke: #E9B308; stroke-width: 12; stroke-dasharray: 452; stroke-dashoffset: 63; --len: 452; animation-delay: 150ms;"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
<span style="font-family: Fredoka, sans-serif; font-size: 34px; font-weight: 600; line-height: 1;">−4.2</span>
<span style="font-size: 13px; color: #5F6B63;">kg de 7 kg</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5F6B63;"><span style="width: 10px; height: 10px; border-radius: 99px; background: {{brand}};"></span>Meta de peso</span>
<span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600;">60%</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5F6B63;"><span style="width: 10px; height: 10px; border-radius: 99px; background: #E9B308;"></span>Plan esta semana</span>
<span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600;">86%</span>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px; animation: rise 500ms ease-out 160ms both;">
<svg class="ico" viewBox="0 0 24 24" style="color: #D9480F; animation: flicker 1.6s ease-in-out infinite; transform-origin: 50% 90%;"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 1 1 2 2 3 3 0-2 0-4 0-6z"></path></svg>
<span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600;">12</span>
<span style="font-size: 12px; color: #5F6B63;">días de racha</span>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px; animation: rise 500ms ease-out 240ms both;">
<svg class="ico" viewBox="0 0 24 24" style="color: {{brand}};"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle></svg>
<span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600;">3/5</span>
<span style="font-size: 12px; color: #5F6B63;">comidas hoy</span>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px; animation: rise 500ms ease-out 320ms both;">
<svg class="ico" viewBox="0 0 24 24" style="color: #1D5FA8;"><path d="M13 3L5 13h6l-1 8 8-10h-6z"></path></svg>
<span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600;">1,240</span>
<span style="font-size: 12px; color: #5F6B63;">de 1,800 kcal</span>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; animation: rise 500ms ease-out 400ms both;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600;">Tu peso</span>
<span style="font-size: 13px; color: #5F6B63;">8 semanas</span>
</div>
<svg viewBox="0 0 320 90" width="100%" height="90">
<path d="M8 18 L48 24 L88 30 L128 34 L168 48 L208 52 L248 64 L288 70 L312 74" style="fill: none; stroke: {{tint}}; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round;"></path>
<path class="spark" d="M8 18 L48 24 L88 30 L128 34 L168 48 L208 52 L248 64 L288 70 L312 74" style="stroke: {{brand}}; stroke-width: 3.5;"></path>
<circle cx="312" cy="74" r="6" style="fill: {{brand}}; animation: rise 300ms ease-out 1700ms both;"></circle>
</svg>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5F6B63;"><span>78.0 kg</span><span style="color: #1B1F1C; font-weight: 700;">73.8 kg hoy</span></div>
</div>

<a href="#" style="display: flex; align-items: center; justify-content: space-between; background: {{brand}}; color: #FFFFFF; text-decoration: none; border-radius: 22px; padding: 16px 20px; animation: rise 500ms ease-out 480ms both;">
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; opacity: .9;">Siguiente comida · 14:00</span><span style="font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600;">Ensalada de quinoa</span></span>
<svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>

<nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #ECE7DC; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box;">
<a class="tab" href="#" style="color: {{brand}};"><svg class="ico" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Inicio</a>
<a class="tab" href="#"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle></svg>Comidas</a>
<a class="tab" href="#"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Recetas</a>
<a class="tab" href="#"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-8"></path></svg>Progreso</a>
<a class="tab" href="#"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#3173BD","options":["#3173BD","#2E7D32","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const brand = this.props.brand ?? '#3173BD';
return { brand: brand, tint: 'color-mix(in srgb, ' + brand + ' 16%, #FFFFFF)' };
}
}
</script>
</body>
</html>
